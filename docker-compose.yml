services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yoru
      POSTGRES_PASSWORD: yoru_local_only
      POSTGRES_DB: yoru
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yoru']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis:/data']
volumes:
  postgres:
  redis:
